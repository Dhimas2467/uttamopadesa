
name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          BASE_URL = "https://dhimas2467.github.io/uttamopadesa"
          ROOT = Path(".")

          EXCLUDED_DIRS = {
              ".git",
              ".github",
              "node_modules",
          }

          EXCLUDED_FILES = {
              "404.html",
          }

          urls = set()

          for file in ROOT.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix.lower() != ".html":
                  continue

              relative = file.relative_to(ROOT)

              if any(part in EXCLUDED_DIRS for part in relative.parts):
                  continue

              if file.name in EXCLUDED_FILES:
                  continue

              if file.name.startswith("google"):
                  continue

              if relative.as_posix() == "index.html":
                  url = BASE_URL + "/"
              else:
                  url = BASE_URL + "/" + relative.as_posix()

              urls.add(url)

          urls.add(BASE_URL + "/")

          xml_urls = "\n".join(
              f"  <url>\n    <loc>{escape(url)}</loc>\n  </url>"
              for url in sorted(urls)
          )

          sitemap = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              f'{xml_urls}\n'
              '</urlset>\n'
          )

          Path("sitemap.xml").write_text(
              sitemap,
              encoding="utf-8"
          )

          print(f"Sitemap berhasil dibuat: {len(urls)} URL")
          PY

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap tidak berubah."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Update sitemap automatically"
          git push
