
name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from xml.sax.saxutils import escape

          BASE_URL = "https://dhimas2467.github.io/uttamopadesa"

          ROOT = Path(".")

          EXCLUDED_DIRS = {
              ".git",
              ".github",
              "node_modules",
          }

          EXCLUDED_FILES = {
              "404.html",
              "footer.html",
              "navigasi.html",
          }

          urls = set()

          for file in ROOT.rglob("*.html"):
              if not file.is_file():
                  continue

              relative = file.relative_to(ROOT)
              parts = relative.parts

              if any(part in EXCLUDED_DIRS for part in parts):
                  continue

              if file.name.lower() in EXCLUDED_FILES:
                  continue

              if file.name.lower().startswith("google"):
                  continue

              encoded_path = quote(
                  relative.as_posix(),
                  safe="/-._~"
              )

              if relative.as_posix() == "index.html":
                  url = BASE_URL + "/"
              else:
                  url = BASE_URL + "/" + encoded_path

              urls.add(url)

          if not urls:
              raise SystemExit("ERROR: Tidak ditemukan halaman HTML.")

          xml_urls = "\n".join(
              f"  <url>\n    <loc>{escape(url)}</loc>\n  </url>"
              for url in sorted(urls)
          )

          sitemap = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              f'{xml_urls}\n'
              '</urlset>\n'
          )

          Path("sitemap.xml").write_text(
              sitemap,
              encoding="utf-8"
          )

          print(f"Sitemap dibuat: {len(urls)} URL")
          PY

      - name: Validate sitemap.xml
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("sitemap.xml")
          root = tree.getroot()

          namespace = {
              "sm": "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          urls = root.findall("sm:url/sm:loc", namespace)

          if not urls:
              raise SystemExit("ERROR: Sitemap kosong.")

          for item in urls:
              if not item.text or not item.text.startswith(
                  "https://dhimas2467.github.io/uttamopadesa/"
              ):
                  raise SystemExit(
                      f"ERROR: URL tidak valid: {item.text}"
                  )

          print(f"Sitemap valid: {len(urls)} URL")
          PY

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap tidak berubah."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Update sitemap automatically"
          git push
