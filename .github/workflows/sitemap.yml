name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          BASE_URL = "https://dhimas2467.github.io/uttamopadesa"
          ROOT = Path(".")

          # Folder dan berkas yang tidak perlu masuk sitemap
          EXCLUDED_DIRS = {
              ".git",
              ".github",
              "node_modules",
          }

          EXCLUDED_FILES = {
              "404.html",
          }

          urls = set()

          for file in ROOT.rglob("*.html"):
              relative = file.relative_to(ROOT)

              if any(part in EXCLUDED_DIRS for part in relative.parts):
                  continue

              if file.name in EXCLUDED_FILES:
                  continue

              if file.name.startswith("google"):
                  continue

              # index.html pada root menjadi URL beranda
              if relative.as_posix() == "index.html":
                  url = BASE_URL + "/"
              else:
                  url = BASE_URL + "/" + relative.as_posix()

              urls.add(url)

          # Pastikan beranda tetap masuk
          urls.add(BASE_URL + "/")

          xml_urls = "\n".join(
              f"  <url>\n    <loc>{escape(url)}</loc
